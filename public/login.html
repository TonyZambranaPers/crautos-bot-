<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRautos Bot — Login</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#f0efeb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .box{
    background:#fff;
    border:1px solid #e0e0dc;
    border-radius:16px;
    padding:2.5rem 2rem;
    width:100%;
    max-width:380px;
    box-shadow:0 4px 24px rgba(0,0,0,.07);
  }
  .logo{
    text-align:center;
    margin-bottom:1.75rem;
  }
  .logo h1{
    font-size:22px;
    font-weight:700;
    color:#1a1a1a;
  }
  .logo p{
    font-size:13px;
    color:#888;
    margin-top:4px;
  }
  label{
    font-size:12px;
    font-weight:600;
    color:#555;
    display:block;
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  input{
    width:100%;
    padding:10px 13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:14px;
    color:#1a1a1a;
    outline:none;
    transition:border-color .15s;
    margin-bottom:1rem;
  }
  input:focus{border-color:#1a1a1a;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
  .btn{
    width:100%;
    padding:11px;
    background:#1a1a1a;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .15s;
    margin-top:.25rem;
  }
  .btn:hover{opacity:.85}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .err{
    background:#fcebeb;
    color:#791f1f;
    border:1px solid #f09595;
    border-radius:8px;
    padding:.6rem .9rem;
    font-size:13px;
    margin-bottom:1rem;
    display:none;
  }
  .spinner{
    display:inline-block;
    width:14px;height:14px;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .6s linear infinite;
    margin-right:6px;
    vertical-align:middle;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <h1>CRautos Bot</h1>
    <p>Sign in to access the dashboard</p>
  </div>
  <div class="err" id="err"></div>
  <label for="username">Username</label>
  <input type="text" id="username" placeholder="Enter your username" autocomplete="username" autofocus>
  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
  <button class="btn" id="btn" onclick="login()">Sign in</button>
</div>

<script>
  // allow Enter key to submit
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');

    err.style.display = 'none';
    if (!username || !password) {
      err.textContent = 'Please enter both username and password.';
      err.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Signing in...';

    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const d = await r.json();
      if (d.ok) {
        window.location.href = '/';
      } else {
        err.textContent = d.error || 'Invalid username or password.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign in';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    } catch(e) {
      err.textContent = 'Cannot connect to server. Make sure node server.js is running.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }
</script>
</body>
</html>
